html/export_icon=true
html/head_include="<script>(function(){var gl=null,indo=false,pg=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(t,a){var r=pg.call(this,t,a);if(r&&String(t).indexOf('webgl')===0)gl=r;return r;};function recarregar(){if(indo)return;indo=true;var v=document.createElement('div');v.textContent='Recarregando o jogo...';v.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0e0c16;color:#f2c14e;font:16px monospace;z-index:9999';document.body.appendChild(v);location.reload();}function perdeu(){if(!document.hidden){recarregar();return;}document.addEventListener('visibilitychange',function(){if(!document.hidden)recarregar();});}var raf=window.requestAnimationFrame.bind(window);window.requestAnimationFrame=function(cb){return raf(function(ts){if(gl&&gl.isContextLost()){perdeu();return;}cb(ts);});};window.addEventListener('pageshow',function(e){if(e.persisted)recarregar();});document.addEventListener('webglcontextlost',function(e){e.preventDefault();e.stopPropagation();perdeu();},true);})();</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
